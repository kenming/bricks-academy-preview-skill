<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="24" y="36" fill="#f8fafc" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700">Implicit Invocation Example</text>
<rect x="1140" y="16" rx="10" ry="10" width="236" height="34" fill="#0f766e"/>
<text x="1160" y="38" fill="#ecfeff" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700">IMPLICIT INVOCATION</text>
<rect x="24" y="64" rx="14" ry="14" width="1352" height="52" fill="#1d4ed8"/>
<text x="42" y="96" fill="#eff6ff" font-family="DejaVu Sans Mono, monospace" font-size="18">User: What is the Container element used for in Bricks?</text>
<rect x="24" y="136" rx="12" ry="12" width="1352" height="88" fill="#111827" stroke="#334155"/>
<text x="40" y="162" fill="#93c5fd" font-family="DejaVu Sans Mono, monospace" font-size="16">$ search_corpus.py 'container' --kind element --limit 5</text>
<text x="42" y="190" fill="#d1d5db" font-family="DejaVu Sans Mono, monospace" font-size="16">01. Container | element | builder/elements</text>
<text x="42" y="216" fill="#d1d5db" font-family="DejaVu Sans Mono, monospace" font-size="16">02. Button | element | builder/elements</text>
<rect x="24" y="244" rx="14" ry="14" width="1352" height="132" fill="#1f2937"/>
<text x="42" y="272" fill="#e5e7eb" font-family="DejaVu Sans Mono, monospace" font-size="18">Assistant: Container is a core layout element. The docs say it</text>
<text x="42" y="298" fill="#e5e7eb" font-family="DejaVu Sans Mono, monospace" font-size="18">defaults to 1100px width, is centered, and uses flexbox.</text>
<text x="42" y="324" fill="#e5e7eb" font-family="DejaVu Sans Mono, monospace" font-size="18">Bricks recommends using it at the root level or inside a Section</text>
<text x="42" y="350" fill="#e5e7eb" font-family="DejaVu Sans Mono, monospace" font-size="18">for layout composition.</text>
</svg>
